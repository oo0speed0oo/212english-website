<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>212 English – Dashboard</title>
<link rel="stylesheet" href="components/base.css">
<style>
  .welcome-banner { margin-bottom:32px; padding-bottom:24px; border-bottom:1px solid rgba(201,168,76,0.1); }
  .welcome-banner h1 { font-family:'Playfair Display',serif; font-size:28px; font-weight:400; color:var(--warm-white); margin-bottom:6px; }
  .welcome-banner h1 em { color:var(--gold); font-style:italic; }
  .welcome-banner p { font-size:14px; color:var(--text-muted); }
  .dash-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; }
  .dash-card { background:rgba(253,250,245,0.04); border:1px solid rgba(201,168,76,0.15); border-radius:14px; padding:24px 20px; cursor:pointer; transition:all 0.3s; text-align:left; text-decoration:none; display:block; }
  .dash-card:hover { background:rgba(201,168,76,0.08); border-color:rgba(201,168,76,0.35); transform:translateY(-3px); box-shadow:0 12px 40px rgba(0,0,0,0.3); }
  .dash-card-icon  { font-size:28px; margin-bottom:14px; }
  .dash-card-title { font-size:16px; font-weight:500; color:var(--warm-white); margin-bottom:4px; }
  .dash-card-sub   { font-size:12px; color:var(--text-muted); }
  .dash-card-badge { display:inline-block; margin-top:12px; font-size:11px; padding:3px 10px; border-radius:100px; background:rgba(201,168,76,0.12); color:var(--gold-light); border:1px solid rgba(201,168,76,0.2); }
</style>
</head>
<body>
<div id="nav-mount"></div>
<script src="components/portal.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function() {
  PORTAL.buildNav('home');
  var s = PORTAL.getSession();
  var pc = document.getElementById('page-content');
  pc.innerHTML = '<div class="welcome-banner">'
    + '<h1>Welcome back, <em>' + (s ? s.firstName : 'Student') + '</em> 👋</h1>'
    + '<p>What would you like to study today?</p>'
    + '</div>'
    + '<div class="dash-grid">'
    + '<a class="dash-card" href="homework.html"><div class="dash-card-icon">📚</div><div class="dash-card-title">Homework</div><div class="dash-card-sub">5 levels · 16 chapters each</div><div class="dash-card-badge">Start studying</div></a>'
    + '<a class="dash-card" href="tests.html"><div class="dash-card-icon">📝</div><div class="dash-card-title">Tests</div><div class="dash-card-sub">5 levels · 16 chapters each</div><div class="dash-card-badge">Start studying</div></a>'
    + '<a class="dash-card" href="videos.html"><div class="dash-card-icon">🎬</div><div class="dash-card-title">Videos</div><div class="dash-card-sub">Latest YouTube lessons</div><div class="dash-card-badge">Start watching</div></a>'
    + '<a class="dash-card" href="grades.html"><div class="dash-card-icon">📊</div><div class="dash-card-title">Grades</div><div class="dash-card-sub">Your progress & results</div><div class="dash-card-badge">Coming soon</div></a>'
    + '</div>';
});
</script>
</body>
</html>
