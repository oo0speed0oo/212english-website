<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>212 English – Tests</title>
<link rel="stylesheet" href="components/base.css">
</head>
<body>
<div id="nav-mount"></div>
<script src="components/portal.js"></script>
<script>
var level = null, chapter = null;

window.addEventListener('DOMContentLoaded', function() {
  PORTAL.buildNav('tests');
  renderLevels();
});

function getPC() { return document.getElementById('page-content'); }

function renderLevels() {
  level = null; chapter = null;
  var html = '<div class="section-header"><h2>Tests</h2><p>Choose your level then chapter.</p></div>'
    + '<div class="breadcrumb"><span>Tests</span></div>'
    + '<div class="level-grid">';
  for (var i = 1; i <= 5; i++) {
    html += '<div class="level-btn" onclick="renderChapters(' + i + ')">'
      + '<span class="num">' + i + '</span><span class="lbl">Level ' + i + '</span></div>';
  }
  html += '</div>';
  getPC().innerHTML = html;
}

function renderChapters(lvl) {
  level = lvl;
  var html = '<div class="section-header"><h2>Tests</h2><p>Choose your chapter.</p></div>'
    + '<div class="breadcrumb"><span>Tests</span><span class="sep">›</span><span>Level ' + lvl + '</span></div>'
    + '<button class="back-btn" onclick="renderLevels()">← Back to Levels</button>'
    + '<div class="chapter-grid">';
  for (var c = 1; c <= 16; c++) {
    html += '<div class="chapter-btn" onclick="renderTest(' + c + ')">'
      + '<span class="num">' + c + '</span><span class="lbl">Chapter ' + c + '</span></div>';
  }
  html += '</div>';
  getPC().innerHTML = html;
}

function renderTest(ch) {
  chapter = ch;
  var html = '<div class="section-header"><h2>Tests</h2></div>'
    + '<div class="breadcrumb"><span>Tests</span><span class="sep">›</span><span>Level ' + level + '</span><span class="sep">›</span><span>Chapter ' + chapter + '</span></div>'
    + '<button class="back-btn" onclick="renderChapters(' + level + ')">← Back to Chapters</button>'
    + '<div class="coming-soon"><div class="cs-icon">📝</div>'
    + '<h3>Test — Level ' + level + ' · Chapter ' + chapter + '</h3>'
    + '<p>This test is being prepared. Check back soon!</p></div>';
  getPC().innerHTML = html;
}
</script>
</body>
</html>
